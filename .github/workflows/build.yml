name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build MacGesture
        run: |
          xcodebuild \
            -project MacGesture.xcodeproj \
            -scheme MacGesture \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: MacGesture-debug
          path: ${{ runner.temp }}/DerivedData/Build/Products/Debug/MacGesture.app
          if-no-files-found: error
